<style>
:root{
  --cream:#F7F1E5;
  --cream-2:#EFE7D6;
  --navy:#2B3A55;
  --navy-2:#1D2840;
  --accent:#E8734A;
  --accent-2:#D9603A;
  --ink:#33302A;
  --sub:#8A8374;
  --line:#E0D6BE;
  --danger:#C4483C;
  --ok:#5C8A66;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'M PLUS Rounded 1c','Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;
  background:
    radial-gradient(circle at 1px 1px, rgba(43,58,85,0.06) 1px, transparent 1px) 0 0/22px 22px,
    var(--cream);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:40px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit}
input:focus,textarea:focus{outline:none}

/* Header */
header{
  background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#fff;
  padding:18px 20px 22px;
  position:sticky;top:0;z-index:60;
  box-shadow:0 4px 16px rgba(29,40,64,.28);
  display:flex;align-items:center;gap:10px;
}
header .bell{font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
header h1{font-size:19px;font-weight:800;letter-spacing:.5px}
header .sync-dot{
  margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#cfd7e6;
}
header .sync-dot .dot{width:8px;height:8px;border-radius:50%;background:#6fbf7a;box-shadow:0 0 0 3px rgba(111,191,122,.25)}
header .sync-dot.offline .dot{background:#e0a03a;box-shadow:0 0 0 3px rgba(224,160,58,.25)}

/* Quick add card */
main{max-width:520px;margin:0 auto;padding:0 16px}
.add-card{
  background:#fff;
  border-radius:20px;
  margin-top:-14px;
  padding:18px 18px 16px;
  box-shadow:0 10px 28px rgba(43,58,85,.14);
  border:1px solid var(--line);
  position:relative;
  z-index:10;
}
.add-card .label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px;letter-spacing:.03em}
.content-input{
  width:100%;
  border:2px solid var(--line);
  border-radius:14px;
  padding:14px 50px 14px 14px;
  font-size:16px;
  background:var(--cream);
  color:var(--ink);
}
.content-input:focus{border-color:var(--accent)}
.input-wrap{position:relative;margin-bottom:14px}
.input-wrap .mic-hint{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:18px;opacity:.55;pointer-events:none;
}
.mic-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;background:var(--cream-2);color:var(--navy);
  transition:background .15s ease, transform .15s ease;
}
.mic-btn:active{transform:translateY(-50%) scale(.9)}
.mic-btn.listening{
  background:var(--danger);color:#fff;
  animation:micPulse 1s ease-in-out infinite;
}
.mic-btn.unsupported{opacity:.4}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(196,72,60,.45)}
  50%{box-shadow:0 0 0 8px rgba(196,72,60,0)}
}
.dt-row{display:flex;gap:10px;margin-bottom:12px}
.dt-input{
  flex:1;border:2px solid var(--line);border-radius:14px;padding:12px 12px;
  font-size:15px;background:var(--cream);color:var(--ink);
}
.dt-input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  background:var(--cream-2);border:1.5px solid var(--line);color:var(--navy);
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
  transition:transform .12s ease, background .15s ease;
}
.chip:active{transform:scale(.94);background:#e6dcc2}
.save-btn{
  width:100%;background:linear-gradient(135deg,var(--accent) 0%, var(--accent-2) 100%);
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.04em;
  padding:14px;border-radius:14px;box-shadow:0 6px 16px rgba(216,96,58,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.save-btn:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(216,96,58,.3)}
.save-btn:disabled{opacity:.45;box-shadow:none}

/* section title */
.section-title{
  display:flex;align-items:baseline;gap:8px;margin:26px 4px 10px;
  color:var(--navy);
}
.section-title h2{font-size:14px;font-weight:800;letter-spacing:.04em}
.section-title .count{font-size:12px;color:var(--sub);font-weight:700}
.section-title .rule{flex:1;height:1px;background:var(--line)}

/* alarm list */
.empty{
  text-align:center;color:var(--sub);font-size:13px;padding:30px 10px;
  background:#fff;border:1.5px dashed var(--line);border-radius:16px;
}
.alarm-list{display:flex;flex-direction:column;gap:10px}
.alarm-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:14px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 8px rgba(43,58,85,.06);
  animation:slideIn .25s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.alarm-card.soon{border-color:var(--accent);box-shadow:0 2px 10px rgba(232,115,74,.18)}
.alarm-time-box{
  min-width:64px;text-align:center;background:var(--cream-2);border-radius:12px;
  padding:8px 6px;flex-shrink:0;
}
.alarm-time-box .day{font-size:10px;color:var(--sub);font-weight:700}
.alarm-time-box .time{font-size:17px;font-weight:800;color:var(--navy)}
.alarm-body{flex:1;min-width:0}
.alarm-body .content{font-size:15px;font-weight:700;color:var(--ink);word-break:break-word;line-height:1.35}
.alarm-body .remain{font-size:11.5px;color:var(--sub);margin-top:3px}
.alarm-card.soon .remain{color:var(--accent-2);font-weight:700}
.del-btn{
  flex-shrink:0;width:34px;height:34px;border-radius:10px;background:var(--cream);
  color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;
}
.del-btn:active{background:#f1cfc7;color:var(--danger)}

/* fire modal */
.fire-overlay{
  position:fixed;inset:0;background:rgba(29,40,64,.92);
  display:none;align-items:center;justify-content:center;z-index:1000;
  padding:24px;backdrop-filter:blur(2px);
}
.fire-overlay.show{display:flex}
.fire-card{
  background:#fff;border-radius:24px;padding:34px 26px 26px;max-width:360px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:pop .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.fire-bell{font-size:56px;display:inline-block;animation:ring 0.5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
.fire-card .fire-time{font-size:13px;color:var(--sub);font-weight:700;margin-top:10px}
.fire-card .fire-content{font-size:20px;font-weight:800;color:var(--navy);margin:14px 0 22px;line-height:1.4;word-break:break-word}
.fire-stop{
  width:100%;background:linear-gradient(135deg,var(--accent) 0%, var(--accent-2) 100%);
  color:#fff;font-size:17px;font-weight:800;padding:15px;border-radius:14px;
  box-shadow:0 6px 16px rgba(216,96,58,.35);
}
.fire-snooze{
  width:100%;margin-top:10px;background:none;color:var(--sub);font-size:13px;font-weight:700;
  padding:8px;text-decoration:underline;
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;
  font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:900;opacity:0;
  transition:transform .3s ease, opacity .3s ease;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.setup-banner{
  background:#FFF3D6;border:1.5px solid #E9C97A;color:#7A5A16;font-size:12.5px;font-weight:600;
  border-radius:14px;padding:10px 14px;margin:14px 4px 0;line-height:1.5;
}
.setup-banner code{background:#fff;padding:1px 5px;border-radius:5px;font-size:11.5px}
.push-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.push-btn{
  width:100%;background:var(--navy);color:#fff;font-size:14.5px;font-weight:800;
  padding:12px;border-radius:12px;
}
.push-btn:active{opacity:.85}
.push-btn.enabled{background:var(--ok)}
.push-btn:disabled{opacity:.5}
.push-status{text-align:center;font-size:11.5px;color:var(--sub);margin-top:6px}
footer{
  text-align:center;color:var(--sub);font-size:11px;margin-top:34px;padding:0 20px;line-height:1.7;
}
</style>
</head>
<body>

<header>
  <span class="bell">🔔</span>
  <h1>アラームメモ</h1>
  <div class="sync-dot" id="syncDot"><span class="dot"></span><span id="syncLabel">同期中</span></div>
</header>

<main>
  <div class="add-card">
    <div class="label">内容（🎤 マイクをタップで音声入力）</div>
    <div class="input-wrap">
      <input type="text" id="contentInput" class="content-input" placeholder="例）お弁当をレンジから出す" maxlength="200">

      <button type="button" tabindex="-1" class="chip" data-day="1" data-hour="15">15時</button>
      <button type="button" tabindex="-1" class="chip" data-day="1" data-hour="18">18時</button>

    <button class="save-btn" id="saveBtn">＋ アラームを登録</button>

    <div class="setup-banner" id="setupBanner" style="display:none">
      ⚠️ Firebase未設定のため、この端末のみに保存されます。複数端末で同期するには、コード冒頭の <code>firebaseConfig</code> をご自身のFirebaseプロジェクトの値に書き換えてください。
    </div>

    <div class="push-row" id="pushRow">
      <button class="push-btn" id="pushBtn">🔒 ロック中も通知を受け取る</button>

    </div>
  </div>

  <div class="section-title">
    <h2>登録済みアラーム</h2>
    <span class="count" id="listCount"></span>
    <span class="rule"></span>
  </div>
  <div id="listArea"></div>

  <footer>
    ※ 通知はこの画面を開いている間に鳴ります。ブラウザ／アプリを閉じると鳴らない場合があります。<br>
    ホーム画面に追加すると、アプリのように起動できます。
  </footer>
</main>

<div class="fire-overlay" id="fireOverlay">
  <div class="fire-card">
    <span class="fire-bell">🔔</span>
    <div class="fire-time" id="fireTime"></div>
    <div class="fire-content" id="fireContent"></div>
    <button class="fire-stop" id="fireStopBtn">停止する</button>
    <button class="fire-snooze" id="fireSnoozeBtn">5分後にもう一度</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
/* ============================================================
   Firebase設定
   ここを自分のFirebaseプロジェクトの値に書き換えてください。
   （Firebaseコンソール → プロジェクトの設定 → 全般 → マイアプリ）
   複数端末で同じ設定を使うことで、データが自動的に同期されます。
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAMIGXrZ6pM1WxwdaIT--y6YmK7ptwRr5k",
  authDomain: "alarm-memo.firebaseapp.com",
  databaseURL: "https://alarm-memo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "alarm-memo",
  storageBucket: "alarm-memo.firebasestorage.app",
  messagingSenderId: "970940384153",
  appId: "1:970940384153:web:b3046640a8a52a81000908"
};

let dbRef = null;
let useFirebase = false;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('alarms');
    useFirebase = true;
  }
}catch(e){ console.warn('Firebase init failed, fallback to localStorage', e); }

document.getElementById('setupBanner').style.display = useFirebase ? 'none' : 'block';

/* ============================================================
   ロック中プッシュ通知（Firebase Cloud Messaging / Android向け）
   要設定：
   1. Firebaseコンソール → プロジェクトの設定 → Cloud Messaging →
      「ウェブ配信証明書」で鍵ペア（VAPIDキー）を生成し、下の値を書き換える
   2. 同じフォルダに firebase-messaging-sw.js を配置する（別途お渡しします）
   3. サーバー側（Cloud Functions）のデプロイが別途必要です
============================================================ */
const VAPID_KEY = "BOfzVfkzCDACnI0kSDdvdXQYhk-_WHmjD0pD42Hgb4oOLyY7yxe1jvw4GP9jigwX62SgpCUGc53xoW0y2TV9DSk";

const pushBtn = document.getElementById('pushBtn');
const pushStatus = document.getElementById('pushStatus');
let messaging = null;

function setPushStatus(text, enabled){
  pushStatus.textContent = text;
  pushBtn.classList.toggle('enabled', !!enabled);
}

if(!useFirebase){
  pushBtn.disabled = true;
  setPushStatus('Firebase未設定のため利用できません');
}else if(!('serviceWorker' in navigator) || !('PushManager' in window)){
  pushBtn.disabled = true;
  setPushStatus('この端末・ブラウザは非対応です（Android Chrome推奨）');
}else if(VAPID_KEY === "YOUR_VAPID_KEY"){
  pushBtn.disabled = true;
  setPushStatus('VAPIDキー未設定のため利用できません');
}else{
  messaging = firebase.messaging();
  if(Notification.permission === 'granted' && localStorage.getItem('alarm_memo_push_token')){
    setPushStatus('有効になっています', true);
  }else{
    setPushStatus('未設定（タップして有効化）');
  }
}

async function enablePush(){
  if(!messaging) return;
  try{
    setPushStatus('登録中…');
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      setPushStatus('通知が許可されませんでした');
      return;
    }
    const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if(!token){
      setPushStatus('トークンの取得に失敗しました');
      return;
    }
    await firebase.database().ref('fcmTokens/' + token).set({ createdAt: Date.now() });
    localStorage.setItem('alarm_memo_push_token', token);
    setPushStatus('有効になりました。ロック中も通知されます', true);
  }catch(e){
    console.error(e);
    setPushStatus('登録に失敗しました：' + e.message);
  }
}
pushBtn.addEventListener('click', enablePush);

/* フォアグラウンドでプッシュを受信した場合は、自前のポップアップで表示する */
if(messaging){
  messaging.onMessage(payload => {
    const data = payload.data || {};
    if(!data.alarmId) return;
    fireAlarm(data.alarmId, { content: data.content || '', datetime: data.datetime || new Date().toISOString() });
  });
}

/* ============================================================
   状態管理
============================================================ */
const LOCAL_KEY = 'alarm_memo_local_v1';
let alarms = {}; // id -> {content, datetime, createdAt}
const firing = new Set();     // 現在発火中(モーダル表示中)のid
const firedOnce = new Set();  // このセッションで既に発火させたid（重複発火防止）

function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); }catch(e){ return {}; }
}
function saveLocal(data){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
}

function setSync(status){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if(status === 'online'){ dot.classList.remove('offline'); label.textContent='同期中'; }
  else if(status === 'local'){ dot.classList.add('offline'); label.textContent='この端末のみ'; }
  else { dot.classList.add('offline'); label.textContent='オフライン'; }
}

if(useFirebase){
  setSync('online');
  dbRef.on('value', snap => {
    alarms = snap.val() || {};
    renderList();
  }, err => { console.error(err); setSync('offline'); });
  firebase.database().ref('.info/connected').on('value', s => {
    if(s.val()===true) setSync('online'); else setSync('offline');
  });
}else{
  setSync('local');
  alarms = loadLocal();
  renderList();
}

function addAlarm(content, datetimeISO){
  const id = 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const entry = { content, datetime: datetimeISO, createdAt: Date.now() };
  if(useFirebase){
    dbRef.child(id).set(entry);
  }else{
    alarms[id] = entry;
    saveLocal(alarms);
    renderList();
  }
}

function removeAlarm(id){
  if(useFirebase){
    dbRef.child(id).remove();
  }else{
    delete alarms[id];
    saveLocal(alarms);
    renderList();
  }
}

/* ============================================================
   フォーム / クイック入力
============================================================ */
const contentInput = document.getElementById('contentInput');
const dtInput = document.getElementById('dtInput');
const saveBtn = document.getElementById('saveBtn');

function toLocalInputValue(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function defaultDatetime(){
  const d = new Date();
  d.setSeconds(0,0);
  return d;
}
dtInput.value = toLocalInputValue(defaultDatetime());

function currentDtOrNow(){
  const v = dtInput.value ? new Date(dtInput.value) : null;
  return (v && !isNaN(v.getTime())) ? v : new Date();
}

function handleChipClick(e){
  const btn = e.target.closest('.chip');
  if(!btn) return;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if(btn.dataset.add !== undefined){
    // 加算チップ：現在設定されている日時に加算（連打で積み上がる）
    const base = currentDtOrNow();
    const target = new Date(base.getTime() + parseInt(btn.dataset.add,10)*60000);
    dtInput.value = toLocalInputValue(target);
  }else if(btn.dataset.hour !== undefined){
    // 絶対時刻チップ：今日/明日の指定時刻に上書き
    const target = new Date();
    target.setDate(target.getDate() + parseInt(btn.dataset.day,10));
    target.setHours(parseInt(btn.dataset.hour,10),0,0,0);
    dtInput.value = toLocalInputValue(target);
  }
}
document.getElementById('chipsToday').addEventListener('click', handleChipClick);
document.getElementById('chipsTomorrow').addEventListener('click', handleChipClick);
document.getElementById('chipsAdd').addEventListener('click', handleChipClick);
['chipsToday','chipsTomorrow','chipsAdd'].forEach(id=>{
  document.getElementById(id).addEventListener('pointerdown', e=>{
    if(e.target.closest('.chip')) e.preventDefault();
  });
});

function resetForm(){
  contentInput.value = '';
  dtInput.value = toLocalInputValue(defaultDatetime());
  contentInput.focus();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

function handleSave(){
  const content = contentInput.value.trim();
  const dtVal = dtInput.value;
  if(!content){ showToast('内容を入力してください'); contentInput.focus(); return; }
  if(!dtVal){ showToast('日時を選択してください'); return; }
  const d = new Date(dtVal);
  if(isNaN(d.getTime())){ showToast('日時が正しくありません'); return; }
  addAlarm(content, d.toISOString());
  showToast('アラームを登録しました');
  resetForm();
  if(Notification && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}
saveBtn.addEventListener('click', handleSave);
contentInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); handleSave(); } });

/* ============================================================
   ワンタップ音声入力（Web Speech API）
============================================================ */
const micBtn = document.getElementById('micBtn');
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let baseTextBeforeListening = '';

if(SpeechRecognitionCtor){
  recognition = new SpeechRecognitionCtor();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let finalText = '';
    let interimText = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const chunk = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += chunk;
      else interimText += chunk;
    }
    contentInput.value = (baseTextBeforeListening + finalText + interimText).slice(0,200);
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    baseTextBeforeListening = contentInput.value;
  };
  recognition.onerror = (e) => {
    listening = false;
    micBtn.classList.remove('listening');
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      showToast('マイクの使用が許可されていません');
    }else if(e.error !== 'no-speech' && e.error !== 'aborted'){
      showToast('音声入力でエラーが発生しました');
    }
  };

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
      return;
    }
    baseTextBeforeListening = contentInput.value ? contentInput.value + '　' : '';
    try{
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
    }catch(e){
      showToast('音声入力を開始できませんでした');
    }
  });
}else{
  micBtn.classList.add('unsupported');
  micBtn.addEventListener('click', () => {
    showToast('この端末は音声入力に対応していません。キーボードのマイクをご利用ください');
    contentInput.focus();
  });
}

/* ============================================================
   一覧表示
============================================================ */
function formatDayLabel(d, now){
  const sameDay = d.toDateString() === now.toDateString();
  const tmr = new Date(now); tmr.setDate(tmr.getDate()+1);
  const isTmr = d.toDateString() === tmr.toDateString();
  if(sameDay) return '今日';
  if(isTmr) return '明日';
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${wd})`;
}
function formatTime(d){
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatRemain(ms){
  if(ms <= 0) return 'まもなく通知';
  const min = Math.floor(ms/60000);
  if(min < 1) return 'まもなく';
  if(min < 60) return `あと${min}分`;
  const h = Math.floor(min/60), m = min%60;
  if(h < 24) return `あと${h}時間${m>0? m+'分':''}`;
  const days = Math.floor(h/24);
  return `あと${days}日`;
}

function renderList(){
  const listArea = document.getElementById('listArea');
  const now = new Date();
  const entries = Object.entries(alarms || {}).sort((a,b)=> new Date(a[1].datetime) - new Date(b[1].datetime));
  document.getElementById('listCount').textContent = entries.length ? `${entries.length}件` : '';
  if(entries.length === 0){
    listArea.innerHTML = `<div class="empty">登録中のアラームはありません。<br>上のフォームから追加してください。</div>`;
    return;
  }
  listArea.innerHTML = `<div class="alarm-list">${entries.map(([id, a])=>{
    const d = new Date(a.datetime);
    const remainMs = d - now;
    const soon = remainMs > 0 && remainMs < 10*60000;
    return `
      <div class="alarm-card ${soon?'soon':''}" data-id="${id}">
        <div class="alarm-time-box">
          <div class="day">${formatDayLabel(d, now)}</div>
          <div class="time">${formatTime(d)}</div>
        </div>
        <div class="alarm-body">
          <div class="content">${escapeHtml(a.content)}</div>
          <div class="remain">${formatRemain(remainMs)}</div>
        </div>
        <button class="del-btn" data-del="${id}">✕</button>
      </div>`;
  }).join('')}</div>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('listArea').addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if(!btn) return;
  const id = btn.dataset.del;
  if(confirm('このアラームを削除しますか？')) removeAlarm(id);
});

/* 残り時間表示の定期更新 */
setInterval(renderList, 30000);

/* ============================================================
   発火（ポップアップ + バイブレーション + 音）
============================================================ */
const fireOverlay = document.getElementById('fireOverlay');
const fireContent = document.getElementById('fireContent');
const fireTime = document.getElementById('fireTime');
let audioCtx = null;
let beepTimer = null;
let vibTimer = null;
let currentFiringId = null;
let currentFiringQueue = [];

function beepOnce(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.35, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
    o.start(t0); o.stop(t0+0.4);
  }catch(e){ /* audio unavailable */ }
}

function startAlerting(){
  beepOnce();
  beepTimer = setInterval(beepOnce, 700);
  try{
    if(navigator.vibrate){
      navigator.vibrate([400,200,400,200,400]);
      vibTimer = setInterval(()=>navigator.vibrate([400,200,400,200,400]), 1600);
    }
  }catch(e){}
}
function stopAlerting(){
  clearInterval(beepTimer); beepTimer=null;
  clearInterval(vibTimer); vibTimer=null;
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}

function tryNotify(content, timeStr){
  try{
    if(document.hidden && Notification && Notification.permission === 'granted'){
      const n = new Notification('🔔 アラームメモ', { body: `${timeStr}  ${content}`, tag:'alarm-memo' });
      n.onclick = () => { window.focus(); n.close(); };
    }
  }catch(e){}
}

function fireAlarm(id, a){
  if(firedOnce.has(id)) return;
  firedOnce.add(id);
  currentFiringQueue.push({id, a});
  processQueue();
}
function processQueue(){
  if(currentFiringId) return; // 既に表示中
  const next = currentFiringQueue.shift();
  if(!next) return;
  currentFiringId = next.id;
  const d = new Date(next.a.datetime);
  const timeStr = `${formatDayLabel(d,new Date())} ${formatTime(d)}`;
  fireTime.textContent = timeStr;
  fireContent.textContent = next.a.content;
  fireOverlay.classList.add('show');
  startAlerting();
  tryNotify(next.a.content, timeStr);
}
function dismissCurrent(remove){
  stopAlerting();
  fireOverlay.classList.remove('show');
  if(remove && currentFiringId) removeAlarm(currentFiringId);
  currentFiringId = null;
  setTimeout(processQueue, 300);
}
document.getElementById('fireStopBtn').addEventListener('click', ()=> dismissCurrent(true));
document.getElementById('fireSnoozeBtn').addEventListener('click', ()=>{
  const snoozeId = currentFiringId;
  const content = fireContent.textContent;
  dismissCurrent(true);
  const t = new Date(Date.now() + 5*60000);
  addAlarm(content, t.toISOString());
  showToast('5分後に再通知します');
});

/* 毎秒チェック：時刻が来たアラームを発火 */
setInterval(()=>{
  const now = Date.now();
  Object.entries(alarms||{}).forEach(([id,a])=>{
    const t = new Date(a.datetime).getTime();
    if(t <= now && !firedOnce.has(id)){
      fireAlarm(id, a);
    }
  });
}, 1000);

renderList();
</script>
